apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: d2-results-
spec:
  entrypoint: graph
  arguments:
    parameters: [{name: code, value: "1"}]
  templates:
  - name: exit-with
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo exit {{workflow.parameters.code}}; exit {{workflow.parameters.code}}"]
  - name: echo
    inputs:
      parameters: [{name: msg}]
    container:
      image: alpine:3.23
      command: [echo, "{{inputs.parameters.msg}}"]
  - name: graph
    dag:
      tasks:
      - {name: A, template: exit-with}
      - {name: plain,     depends: "A",                       template: echo, arguments: {parameters: [{name: msg, value: plain}]}}
      - {name: on-fail,   depends: "A.Failed",                template: echo, arguments: {parameters: [{name: msg, value: on-fail}]}}
      - {name: either,    depends: "A.Succeeded || A.Failed", template: echo, arguments: {parameters: [{name: msg, value: either}]}}
      - {name: not-ok,    depends: "!A.Succeeded",            template: echo, arguments: {parameters: [{name: msg, value: not-ok}]}}
      - {name: last,      depends: "on-fail && either",       template: echo, arguments: {parameters: [{name: msg, value: last}]}}
