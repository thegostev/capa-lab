apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: release-
spec:
  entrypoint: release
  arguments:
    parameters:
    - name: env
      value: dev
  templates:
  - name: release
    dag:
      tasks:
      - name: build
        template: say-build
      - name: deploy
        depends: "build"
        when: "{{workflow.parameters.env}} == prod"
        template: say-deploy
      - name: notify
        depends: "deploy.Succeeded"
        template: say-notify
  - name: say-build
    container:
      image: alpine:3.23
      command: [echo, "build done"]
  - name: say-deploy
    container:
      image: alpine:3.23
      command: [echo, "deployed"]
  - name: say-notify
    container:
      image: alpine:3.23
      command: [echo, "Slack: deploy done"]