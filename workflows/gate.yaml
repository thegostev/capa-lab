apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: gate-
spec:
  entrypoint: graph
  arguments:
    parameters:
    - name: code
      value: "0"
  templates:
  - name: graph
    dag:
      tasks:
      - name: A
        template: run-a
      - name: B
        depends: "!A.Succeeded"
        template: say-b
  - name: run-a
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo A ends with code {{workflow.parameters.code}}; exit {{workflow.parameters.code}}"]
  - name: say-b
    container:
      image: alpine:3.23
      command: [echo, "B ran"]